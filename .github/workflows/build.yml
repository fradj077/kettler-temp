name: Build N16R8
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "**.ino"
      - "**.h"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "OneWire" "DallasTemperature" "NimBLE-Arduino@1.4.1"
      - name: Compile
        run: |
          mkdir -p sketch/kettler_temp
          F=$(git log --name-only --diff-filter=AM --format= -- "*.ino" | head -1)
          if [ -z "$F" ] || [ ! -f "$F" ]; then F="kettler_temp.ino"; fi
          echo "Using sketch: $F"
          cp "$F" sketch/kettler_temp/kettler_temp.ino
          cp MotorHealth.h sketch/kettler_temp/ 2>/dev/null || true
          cp MotorCurrentDSP.h sketch/kettler_temp/ 2>/dev/null || true
          cp *.h sketch/kettler_temp/ 2>/dev/null || true
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,FlashMode=qio --output-dir out sketch/kettler_temp
      - name: Collect firmware
        run: |
          mkdir -p merged
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT_APP0"
          python -m esptool --chip esp32s3 merge_bin -o merged/kettler_temp_full.bin --flash_mode keep --flash_size 16MB 0x0 out/kettler_temp.ino.bootloader.bin 0x8000 out/kettler_temp.ino.partitions.bin 0xe000 "$BOOT_APP0" 0x10000 out/kettler_temp.ino.bin
          cp out/kettler_temp.ino.bin merged/kettler_temp_app.bin
          cp out/kettler_temp.ino.bin ./kettler_temp_app.bin
      - name: Publish binary to repository for Direct OTA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          cp out/kettler_temp.ino.bin ./kettler_temp_app.bin
          git add kettler_temp_app.bin
          git diff --staged --quiet || (git commit -m "chore: update compiled kettler_temp_app.bin [skip ci]" && git push origin HEAD:main)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: merged
