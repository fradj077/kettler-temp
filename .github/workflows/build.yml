name: Build ESP32-S3 firmware
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "OneWire" "DallasTemperature"
      - name: Compile
        run: |
          mkdir -p sketch/kettler_temp
          cp kettler_temp.ino MotorHealth.h sketch/kettler_temp/
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir out sketch/kettler_temp
      - name: Merge into one file
        run: |
          pip install esptool
          BA=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          python3 -m esptool --chip esp32s3 merge_bin -o merged/kettler_temp_merged.bin 0x0 out/kettler_temp.ino.bootloader.bin 0x8000 out/kettler_temp.ino.partitions.bin 0xe000 "$BA" 0x10000 out/kettler_temp.ino.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: merged/kettler_temp_merged.bin
