name: Build ESP32-S3 firmware
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "OneWire" "DallasTemperature" "NimBLE-Arduino@1.4.1"
      - name: Compile
        run: |
          mkdir -p sketch/kettler_temp
          F=$(git log -1 --name-only --diff-filter=AM --format= -- '*.ino' | head -1)
          echo "Using sketch: $F"
          cp "$F" sketch/kettler_temp/kettler_temp.ino
          cp MotorHealth.h sketch/kettler_temp/
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,FlashMode=qio --output-dir out sketch/kettler_temp
      - name: Collect firmware
        run: |
          mkdir -p merged
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT_APP0"
          python -m esptool --chip esp32s3 merge_bin -o merged/kettler_temp_full.bin --flash_mode keep --flash_size
